[pytest]
# Configures terminal output flags
addopts = -ra -v -x --strict-markers --allow-hosts=127.0.0.1,localhost,::1
testpaths = tests
pythonpath = .
markers =
    unit: Quick, isolated tests for logic.
    functional: Integration/API tests in Flask.
    e2e: End-to-end tests simulating full user flows.
    infra: Checks that the test MySQL/Mailpit services are up and configured.
    register: Tests related to account creation.